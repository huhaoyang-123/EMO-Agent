name: tests
on:
  pull_request:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.7
      - run: python -m uv sync --locked
      - run: python -m uv run --locked pytest
      - run: python -m uv run --locked emo-agent --help
      - run: git diff --check
